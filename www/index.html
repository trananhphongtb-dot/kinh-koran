<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Kinh Koran: Nghe, Đọc &amp; Trắc nghiệm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
      * { box-sizing: border-box; }
      :root{
        --bg:#f3f5f3; --surface:#ffffff; --surface2:#edf1ee; --ink:#15211b; --ink2:#4a5a51;
        --line:#d9e0da; --accent:#0b5d45; --accent-deep:#07402f; --accent-ink:#ffffff;
        --gold:#a97e14; --gold-soft:#f7efdb;
        --good:#1e7a3c; --good-bg:#e2f2e5; --bad:#b3271e; --bad-bg:#fbe7e4;
        --kara-bg:#ffd23f; --kara-ink:#211a12;
        --shadow:0 1px 2px rgba(10,40,30,.08),0 8px 24px rgba(10,40,30,.06);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#0c1310; --surface:#15201a; --surface2:#1b2a21; --ink:#e9f0eb; --ink2:#a7b8ad;
          --line:#2a3a30; --accent:#43b28a; --accent-deep:#7fd3ae; --accent-ink:#08130d;
          --gold:#d9ab2e; --gold-soft:#2e2a18;
          --good:#6fce8b; --good-bg:#17301d; --bad:#ff9a8f; --bad-bg:#3a1712;
          --kara-bg:#d9a92f; --kara-ink:#16120d;
          --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
        }
      }
      html{ -webkit-text-size-adjust:100%; height:100%; overflow:hidden; }
      body{ margin:0; color:var(--ink); height:100dvh; overflow:hidden; overscroll-behavior:none;
        font-family:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:15px; line-height:1.45;
        background:var(--bg); }
      .wrap{ position:relative; max-width:880px; margin:0 auto; height:100%;
        display:flex; flex-direction:column; padding:0 12px 10px;
        padding-top:env(safe-area-inset-top, 0px);
        padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); }
      .wrap > main{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
      #browser-box, #reader-box, #quizHome, #quizRun, #quizDone{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
      #view-settings{ overflow-y:auto; scrollbar-width:thin; }
      h1,h2,h3,.serif{ font-family:"Noto Serif", Georgia, serif; }
      button{ font:inherit; cursor:pointer; }
      :focus-visible{ outline:3px solid var(--gold); outline-offset:2px; border-radius:6px; }
      .hidden{ display:none !important; }

      /* ---------- top strip ---------- */
      .topbar{ display:flex; flex:none; flex-wrap:nowrap; gap:8px; align-items:center; justify-content:space-between;
        padding:6px 0 5px; }
      .iconbtn{ flex:none; width:2.15rem; height:2.15rem; min-height:2.15rem; padding:0; display:grid; place-items:center;
        border:1px solid var(--line); background:var(--surface); color:var(--ink2); border-radius:50%; cursor:pointer; }
      .iconbtn:hover{ border-color:var(--accent); }
      .brand{ flex:1 1 auto; min-width:0; font-family:"Noto Serif",serif; font-weight:900; font-size:1.1rem; letter-spacing:.01em; line-height:1.15;
        overflow-wrap:anywhere; margin:0; }
      /* The language name sits right beside the globe button, on the
         same single row as the title — it never wraps and never drops
         onto a line of its own. */
      .langcluster{ display:inline-flex; flex:none; align-items:center; gap:6px; white-space:nowrap; }
      .langname{ white-space:nowrap; font-family:"Be Vietnam Pro",sans-serif; font-weight:600; font-size:.66rem;
        color:var(--ink2); letter-spacing:.07em; text-transform:uppercase; line-height:1; }
      .seg{ display:inline-flex; background:var(--surface2); border:1px solid var(--line); border-radius:999px; padding:2px; }
      .seg button{ border:0; background:transparent; color:var(--ink2); font-weight:700; font-size:.82rem;
        padding:4px 12px; border-radius:999px; min-height:1.9rem; }
      .seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
      .textsel{ width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
        border-radius:9px; padding:7px 10px; font:inherit; font-weight:700; min-height:2.4rem; }

      /* ---------- tabs: 3 tab — Tra cứu · Trắc nghiệm · Yêu thích ---------- */
      .tabs{ display:grid; flex:none; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:0 0 8px; }
      .tabs button{ border:1px solid var(--line); background:var(--surface); color:var(--ink);
        border-radius:9px; padding:5px 8px; font-weight:800; font-size:.93rem; min-height:2.15rem; }
      .tabs button[aria-selected="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

      /* ---------- lookup ---------- */
      .searchrow{ display:flex; flex:none; gap:6px; margin-bottom:6px; }
      .searchrow input{ flex:1; min-width:0; border:1px solid var(--line); border-radius:9px; background:var(--surface);
        color:var(--ink); padding:6px 11px; font:inherit; font-size:.92rem; min-height:2.15rem; }
      .searchrow button{ border:0; border-radius:9px; background:var(--accent); color:var(--accent-ink);
        font-weight:800; padding:6px 14px; min-height:2.15rem; }
      /* Hàng nút lọc: [Mặc khải ở Mecca · 86] [Mặc khải ở Medina · 28] —
         Yêu thích là tab riêng (thay tab Giới thiệu cũ), không còn nút lọc ở đây. */
      .testament{ display:flex; flex:none; gap:6px; margin:2px 0 6px; }
      .testament button{ flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink2);
        border-radius:999px; font-weight:700; font-size:.84rem; padding:4px 6px; min-height:1.95rem; }
      .testament button[aria-pressed="true"]{ background:var(--gold-soft); color:var(--ink); border-color:var(--gold); }
      .list-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:thin; padding-bottom:2px; }
      .bookgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:5px; padding-bottom:2px; }
      @media (max-width:560px){ .bookgrid{ grid-template-columns:repeat(3,1fr); } }
      .book{ text-align:center; border:1px solid var(--line); background:var(--surface); border-radius:8px;
        padding:5px 4px; color:var(--ink); min-height:1.95rem; display:flex; align-items:center; justify-content:center; width:100%; }
      .book:hover{ border-color:var(--accent); }
      .book b{ display:block; font-family:"Noto Serif",serif; font-size:.82rem; font-weight:700; line-height:1.2; overflow-wrap:anywhere; }
      .book .ar-name{ font-family:"Amiri",serif; font-weight:700; font-size:1.02rem; line-height:1.3; overflow-wrap:anywhere; }
      .empty{ color:var(--ink2); border:1px dashed var(--line); border-radius:10px; padding:10px; text-align:center; font-size:.9rem; }
      .panel{ border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow); }
      .panel h2{ margin:0 0 1px; font-size:1.2rem; font-weight:900; }

      /* ---------- reader page: its own chrome, app header + tabs hidden ---------- */
      body.reading .topbar, body.reading .tabs{ display:none; }
      #reader-box .panel{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
      .readerbar{ display:flex; flex:none; align-items:center; gap:8px; margin:0 0 8px; }
      .readerbar .rtitle{ flex:1 1 auto; min-width:0; text-align:center; margin:0;
        font-size:1.18rem; font-weight:900; line-height:1.2; overflow-wrap:anywhere; }
      .readerbar .rtitle .ar-name{ font-family:"Amiri",serif; }
      .heartbtn{ font-size:1.12rem; line-height:1; }
      .heartbtn.on{ color:var(--bad); border-color:var(--bad); }
      .verses{ flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:thin; }
      .verse{ padding:4px 8px; border-radius:7px; margin:0 -8px; }
      .verse .n{ font-size:.68rem; font-weight:800; color:var(--gold); vertical-align:super; margin-right:4px; }
      .verse .vt{ font-family:"Noto Serif",serif; font-size:.99rem; line-height:1.5; }
      .verse .vt.lang-ar{ font-family:"Amiri",serif; font-size:1.55rem; line-height:2.1; }
      .verse .vt.lang-ur{ font-family:"Noto Nastaliq Urdu","Amiri",serif; font-size:1.25rem; line-height:2.5; }
      .verse .vt.lang-fa{ font-family:"Amiri",serif; font-size:1.3rem; line-height:2; }
      .verse:has(> .vt[dir="rtl"]){ text-align:right; }
      .verse:has(> .vt[dir="rtl"]) .n{ margin-right:0; margin-left:4px; }
      .verse.seek{ background:var(--gold-soft); }
      /* karaoke: the word currently being read aloud */
      .verse .vt .w{ border-radius:3px; padding:0 1px; margin:0 -1px; }
      .verse .vt .w.kara{ background:var(--kara-bg); color:var(--kara-ink); font-weight:700; }
      .basmalah{ font-family:"Amiri",serif; font-size:1.5rem; text-align:center;
        color:var(--accent-deep); margin:2px 0 10px; line-height:1.8; }
      .note-line{ font-size:.8rem; color:var(--ink2); margin:0 0 8px; line-height:1.5; }
      .footnote{ margin-top:3px; font-size:.78rem; color:var(--ink2); line-height:1.5; }
      .footnote b{ color:var(--ink2); font-weight:700; }
      .loading{ text-align:center; color:var(--ink2); padding:20px 10px; }

      /* ---------- listen (text-to-speech) bar ---------- */
      /* One compact row: Listen/Stop (one button that flips label) ·
         Speed · Time. */
      .listenbar{ display:flex; flex:none; flex-wrap:nowrap; gap:5px; align-items:center; margin:0 0 8px; }
      .listenbtn{ border:0; border-radius:9px; background:var(--accent); color:var(--accent-ink);
        font-weight:800; font-size:.88rem; padding:5px 12px; min-height:2.15rem; white-space:nowrap; }
      .listenbtn:disabled{ opacity:.45; cursor:default; }
      .speedwrap{ display:inline-flex; align-items:center; gap:4px; margin-left:auto; flex:none;
        color:var(--ink2); font-size:.78rem; font-weight:700; white-space:nowrap; }
      .speedwrap select, .timewrap select{ border:1px solid var(--line); background:var(--surface); color:var(--ink);
        border-radius:7px; padding:3px 4px; font:inherit; font-size:.83rem; font-weight:700; min-height:1.9rem; }
      /* ---------- sleep timer (hẹn giờ tắt): a "Time" dropdown like Speed;
         once set, the closed select itself shows the live countdown and
         tapping it opens the choices again ---------- */
      .timewrap{ display:inline-flex; align-items:center; flex:none; }
      .timewrap select{ font-variant-numeric:tabular-nums; }
      .timewrap select.counting{ color:var(--accent); border-color:var(--accent); font-weight:800; }
      @media (max-width:400px){
        .listenbtn{ padding:5px 9px; font-size:.84rem; }
        .speedwrap{ font-size:.72rem; gap:3px; }
        .speedwrap select, .timewrap select{ font-size:.79rem; padding:3px 2px; }
      }
      .listen-warn{ flex:none; background:var(--bad-bg); border-radius:10px; padding:9px 12px;
        font-size:.85rem; line-height:1.55; margin-bottom:8px; }
      .listen-warn b{ color:var(--bad); }
      .chapnav{ display:flex; flex:none; gap:6px; margin-top:8px; }
      .chapnav button{ flex:1 1 0; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px;
        font-weight:700; font-size:.88rem; padding:5px 12px; min-height:2.4rem; }
      .chapnav button:disabled{ opacity:.4; cursor:default; }
      .toast{ position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%) translateY(20px); opacity:0;
        background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-weight:700; font-size:.9rem;
        transition:.25s; pointer-events:none; z-index:50; max-width:92vw; text-align:center; }
      .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

      /* ---------- quiz ---------- */
      #quizHome{ justify-content:flex-start; gap:6px; overflow-y:auto; scrollbar-width:thin; }
      .road{ display:flex; flex-direction:column; gap:6px; }
      .stage{ display:flex; flex-direction:column; }
      .stagecard{ display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface);
        border-radius:10px; padding:6px 10px; box-shadow:var(--shadow); }
      .stagecard h3{ margin:0; font-size:.92rem; flex:1; line-height:1.25; }
      .pill{ font-size:.72rem; font-weight:700; background:var(--surface2); border:1px solid var(--line);
        border-radius:999px; padding:2px 8px; color:var(--ink2); white-space:nowrap; }
      .pill.best{ background:var(--gold-soft); color:var(--ink); border-color:var(--gold); }
      .startbtn{ flex:none; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink);
        font-weight:800; font-size:.88rem; padding:5px 13px; min-height:2rem; }
      .quizbar{ display:flex; flex:none; align-items:center; gap:8px; margin-bottom:7px; }
      .quizbar .prog{ flex:1; height:8px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); overflow:hidden; }
      .quizbar .prog i{ display:block; height:100%; background:var(--gold); transition:width .3s; }
      .timer{ font-weight:800; font-size:.9rem; font-variant-numeric:tabular-nums; border:1px solid var(--line); background:var(--surface);
        border-radius:999px; padding:3px 10px; min-width:3.6rem; text-align:center; }
      .timer.low{ color:var(--bad); border-color:var(--bad); }
      /* The question card is pushed to the bottom of the run screen; the
         explanation sits at the top, under the title bar, and the
         Prev / Next bar is pinned to the very bottom. */
      .qcard{ border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow);
        flex:0 1 auto; min-height:0; margin-top:auto; overflow-y:auto; scrollbar-width:thin; }
      .explain-top{ display:none; flex:none; border:1px solid var(--line); background:var(--surface);
        border-radius:12px; padding:10px 12px; box-shadow:var(--shadow); margin-bottom:8px; }
      .explain-top.show{ display:block; }
      .explain-top .verdict{ font-weight:800; margin:0 0 2px; }
      .explain-top .verdict.ok{ color:var(--good); } .explain-top .verdict.no{ color:var(--bad); }
      .explain-top p{ margin:2px 0; font-size:.92rem; }
      .explain-top .refrow{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px; }
      .explain-top .refchip{ font-weight:800; color:var(--accent); font-size:.9rem; }
      .quiznav{ display:flex; flex:none; gap:6px; margin-top:8px; }
      .quiznav button{ flex:1 1 0; min-height:2.5rem; }
      .quiznav button:disabled{ opacity:.4; cursor:default; }
      /* While a quiz is running, the tab bar (Contents tab included) is
         hidden, the same way the reading page hides it. */
      body.quizzing .tabs{ display:none; }
      .qcard .qk{ font-size:.66rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); }
      .qcard h3{ font-size:1.08rem; margin:4px 0 2px; line-height:1.35; }
      .qcard .qverse{ font-family:"Noto Serif", Georgia, serif; font-style:italic;
        background:var(--surface2); border-radius:9px; padding:9px 12px;
        margin:8px 0 2px; line-height:1.6; font-size:.95rem; }
      .opts{ display:grid; gap:6px; margin-top:9px; }
      .opt{ text-align:left; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
        border-radius:9px; padding:7px 10px; font-size:.93rem; line-height:1.35; display:flex; gap:9px; align-items:flex-start; width:100%; }
      .opt .letter{ flex:none; width:1.45rem; height:1.45rem; border-radius:50%; border:1.5px solid var(--line);
        display:grid; place-items:center; font-weight:800; font-size:.78rem; margin-top:0; }
      .opt:not(:disabled):hover{ border-color:var(--gold); }
      .opt.right{ border-color:var(--good); background:var(--good-bg); }
      .opt.right .letter{ background:var(--good); border-color:var(--good); color:#fff; }
      .opt.wrong{ border-color:var(--bad); background:var(--bad-bg); }
      .opt.wrong .letter{ background:var(--bad); border-color:var(--bad); color:#fff; }
      .opt:disabled{ cursor:default; opacity:1; }
      .ghostbtn{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px;
        font-weight:700; font-size:.9rem; padding:5px 12px; min-height:2rem; }
      .nextbtn{ border:0; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-weight:800; padding:7px 18px; min-height:2.1rem; }
      #quizDone{ overflow-y:auto; scrollbar-width:thin; }
      .scorebig{ font-family:"Noto Serif",serif; font-size:2.1rem; font-weight:900; text-align:center; margin:2px 0 0; line-height:1.1; }
      .scorecard{ text-align:center; }
      .scorecard h2{ font-size:1.15rem; }
      .scorecard p{ color:var(--ink2); margin:2px 0; }
      .scoreactions{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:9px; }
      .review{ margin-top:10px; text-align:left; }
      .review h3{ margin:0 0 6px; font-size:1rem; }
      .review .ritem{ border:1px solid var(--line); border-radius:9px; padding:8px 11px; margin-bottom:6px; background:var(--surface); font-size:.9rem; }
      .review .ritem b{ display:block; margin-bottom:2px; }
      .review .ritem .yours{ color:var(--bad); } .review .ritem .corr{ color:var(--good); font-weight:700; }

      /* ---------- settings (mở qua quả cầu, như Kinh Thánh) ---------- */
      .setlabel{ font-weight:800; font-size:.92rem; margin:12px 0 6px; }
      .setlabel:first-of-type{ margin-top:6px; }
      .abouttext{ color:var(--ink2); font-size:.84rem; margin:0; line-height:1.55; }
      .abouttext a{ color:var(--accent); }
      /* ---------- giới thiệu thu gọn (trong Cài đặt, mở ra khi cần) ---------- */
      .aboutbox{ margin-top:14px; border-top:1px solid var(--line); padding-top:8px; }
      .aboutbox summary{ font-weight:800; font-size:.92rem; cursor:pointer; list-style-position:inside; padding:2px 0; }
      .abouttable{ width:100%; border-collapse:collapse; font-size:.8rem; margin:6px 0 4px; }
      .abouttable th{ text-align:left; color:var(--ink2); font-size:.7rem; font-weight:800;
        text-transform:uppercase; letter-spacing:.06em; padding:3px 8px 3px 0; border-bottom:1px solid var(--line); }
      .abouttable th:last-child, .abouttable td:last-child{ padding-right:0; }
      .abouttable td{ padding:5px 8px 5px 0; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
      .abouttable td b{ font-weight:700; }
      .abouttable td .trname{ color:var(--ink2); }
      .abouttable td.ver{ white-space:nowrap; font-variant-numeric:tabular-nums; }
      .aboutinner .abouttext{ margin-top:7px; font-size:.8rem; }
      .nextrow{ display:flex; justify-content:flex-start; margin-top:9px; }
      a { color: var(--accent); }
      @media (prefers-reduced-motion: reduce) {
        .quizbar .prog i { transition: none; }
        .toast { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar" id="topbar">
        <h1 class="brand" id="app-title">Kinh Koran: Nghe, Đọc &amp; Trắc nghiệm</h1>
        <div class="langcluster">
          <span class="langname" id="lang-name-label">Tiếng Việt</span>
          <button type="button" class="iconbtn" id="btn-globe" data-settings="1" aria-label="Chọn ngôn ngữ / Language" title="Language">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          </button>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Chế độ">
        <button type="button" role="tab" id="tab-read" aria-selected="true" data-tab="read"><span id="tab-read-label">Tra cứu</span></button>
        <button type="button" role="tab" id="tab-quiz" aria-selected="false" data-tab="quiz"><span id="tab-quiz-label">Trắc nghiệm</span></button>
        <button type="button" role="tab" id="tab-fav" aria-selected="false" data-tab="fav">♥ <span id="tab-fav-label">Yêu thích</span></button>
      </nav>

      <!-- ============ TRA CỨU ============ -->
      <main id="view-read">
        <div id="browser-box">
          <form class="searchrow" id="searchForm">
            <input id="surah-search" type="search" autocomplete="off" placeholder="Tìm surah…" aria-label="Tìm surah" />
            <button type="submit" id="searchBtn">Tìm</button>
          </form>
          <div class="testament" role="group" aria-label="Nhóm surah">
            <button type="button" data-test="meccan" aria-pressed="true"><span id="lbl-meccan">Mặc khải ở Mecca</span> · 86</button>
            <button type="button" data-test="medinan" aria-pressed="false"><span id="lbl-medinan">Mặc khải ở Medina</span> · 28</button>
          </div>
          <div class="list-scroll" id="list-scroll">
            <div class="bookgrid" id="surah-grid"></div>
            <p class="empty hidden" id="list-empty"></p>
          </div>
        </div>

        <div id="reader-box" class="hidden">
          <div class="panel">

        /* Chỉ giữ trong RAM ngôn ngữ đang chọn; bỏ ngôn ngữ cũ. */
        function pruneLangData() {
          Object.keys(langData).forEach(function (code) {
            if (code !== state.primary) delete langData[code];
          });
        }

        /* ---------- Toast ---------- */
        var toastTimer = null;
        function showToast(msg) {
          var el = $('toast');
          el.textContent = msg;
          el.classList.add('show');
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
        }

        /* ---------- Tabs & views (3 tab + màn Cài đặt mở qua quả cầu) ---------- */
        var tabBtns = document.querySelectorAll('[data-tab]');
        function paintTabs() {
          tabBtns.forEach(function (t) {
            t.setAttribute('aria-selected', String(!settingsOpen && t.getAttribute('data-tab') === state.view));
          });
        }
        function setView(v) {
          stopListen();
          state.view = v;
          settingsOpen = false;
          $('view-settings').classList.add('hidden');
          $('view-read').classList.toggle('hidden', v !== 'read');
          $('view-quiz').classList.toggle('hidden', v !== 'quiz');
          $('view-fav').classList.toggle('hidden', v !== 'fav');
          if (v === 'fav') renderFavorites();
          paintTabs();
        }
        tabBtns.forEach(function (tab) {
          tab.addEventListener('click', function () { setView(tab.getAttribute('data-tab')); });
        });
        function openSettings() {
          stopListen();
          settingsOpen = true;
          $('view-read').classList.add('hidden');
          $('view-quiz').classList.add('hidden');
          $('view-fav').classList.add('hidden');
          $('view-settings').classList.remove('hidden');
          paintTabs();
          var vs = $('view-settings');
          if (vs) vs.scrollTop = 0;
        }
        document.querySelectorAll('[data-settings]').forEach(function (b) {
          b.addEventListener('click', openSettings);
        });
        $('settingsBack').addEventListener('click', function () {
          settingsOpen = false;
          $('view-settings').classList.add('hidden');
          $('view-read').classList.toggle('hidden', state.view !== 'read');
          $('view-quiz').classList.toggle('hidden', state.view !== 'quiz');
          $('view-fav').classList.toggle('hidden', state.view !== 'fav');
          paintTabs();
        });
        document.querySelectorAll('[data-perq]').forEach(function (b) {
          b.addEventListener('click', function () {
            examLen = parseInt(b.getAttribute('data-perq'), 10) || 30;
            storeSet(LS_PERQ, String(examLen));
            document.querySelectorAll('[data-perq]').forEach(function (x) {
              x.setAttribute('aria-pressed', String(x === b));
            });
            renderRoadmap();
          });
        });

        /* ---------- Giao diện theo ngôn ngữ ---------- */
        function applyI18n() {
          var t = ui();
          document.documentElement.lang = state.primary;
          var appTitle = TITLES[state.primary] || TITLES.en;
          $('app-title').textContent = appTitle;
          document.title = appTitle;
          $('tab-read-label').textContent = t.tabRead;
          $('tab-quiz-label').textContent = t.tabQuiz;
          $('tab-fav-label').textContent = t.fav;
          $('lang-name-label').textContent = langByCode[state.primary].name;
          $('btn-globe').setAttribute('aria-label', t.langLabel);
          $('btn-globe-reader').setAttribute('aria-label', t.langLabel);
          var search = $('surah-search');
          search.placeholder = t.searchPh;
          search.setAttribute('aria-label', t.searchLabel);
          $('searchBtn').textContent = t.searchBtn;
          $('lbl-meccan').textContent = t.filterMeccan;
          $('lbl-medinan').textContent = t.filterMedinan;
          $('settings-title').textContent = t.settings;
          $('lang-label').textContent = t.langLabel;
          $('text-note').textContent = t.textNote;
          $('perquiz-label').textContent = t.perQuizLabel;
          $('settingsBack').textContent = t.back;
          $('about-title').textContent = t.aboutTitle;
          $('about-col-trans').textContent = t.aboutColTrans;
          $('about-col-ver').textContent = t.aboutColVer;
          $('about-credit-quranenc').innerHTML = t.aboutQuranEnc;
          $('about-credit-tanzil').innerHTML = t.aboutTanzil;
          $('about-credit-cloud').innerHTML = t.aboutCloud;
          $('textLangSel').value = state.primary;
          document.querySelectorAll('[data-perq]').forEach(function (b) {
            b.setAttribute('aria-pressed', String(parseInt(b.getAttribute('data-perq'), 10) === examLen));
          });
          $('listen-time').setAttribute('aria-label', t.sleepTimer);
          $('listen-time').parentNode.setAttribute('title', t.sleepTimer);
          var offOpt = $('listen-time').querySelector('option[value="0"]');
          if (offOpt) offOpt.textContent = t.sleepOff;
          $('quitQuiz').textContent = t.quit;
          paintListenBar();
          paintSleepRow();
          refreshVoiceWarn();
        }

        /* ---------- Chọn ngôn ngữ (trong màn Cài đặt, như Kinh Thánh) ---------- */
        (function buildLangSelect() {
          var sel = $('textLangSel');
          sel.innerHTML = LANGS.map(function (l) {
            return '<option value="' + l.code + '">' + esc(l.name) + '</option>';
          }).join('');
          sel.value = state.primary;
          sel.addEventListener('change', function () { setLanguage(sel.value); });
        })();

        /* ---------- Bảng 10 bản dịch trong mục Giới thiệu (Cài đặt) ----------
           Tên + phiên bản/edition đúng theo nguồn dữ liệu: bản Việt v1.0.1 từ
           QuranEnc, bản Ả Rập Uthmani của Tanzil, 9 edition qua AlQuranCloud
           (API không ghi số version nên ghi mã edition). */
        var TRANSLATIONS = [
          { lang: 'العربية', trans: 'Uthmani (Tanzil)', ver: 'quran-uthmani' },
          { lang: 'English', trans: 'Saheeh International', ver: 'en.sahih' },
          { lang: 'Tiếng Việt', trans: 'Hasan Abdulkarim', ver: 'v1.0.1' },
          { lang: 'Bahasa Indonesia', trans: 'Kementerian Agama', ver: 'id.indonesian' },
          { lang: 'اردو', trans: 'Fateh Muhammad Jalandhry', ver: 'ur.jalandhry' },
          { lang: 'বাংলা', trans: 'Muhiuddin Khan', ver: 'bn.bengali' },
          { lang: 'Türkçe', trans: 'Diyanet İşleri', ver: 'tr.diyanet' },
          { lang: 'فارسی', trans: 'Mohammad Mahdi Fooladvand', ver: 'fa.fooladvand' },
          { lang: 'Bahasa Melayu', trans: 'Abdullah Muhammad Basmeih', ver: 'ms.basmeih' },
          { lang: 'Français', trans: 'Muhammad Hamidullah', ver: 'fr.hamidullah' }
        ];
        (function buildAboutRows() {
          $('about-rows').innerHTML = TRANSLATIONS.map(function (r) {
            return '<tr><td><b>' + esc(r.lang) + '</b> — <span class="trname">' + esc(r.trans) + '</span></td>' +
              '<td class="ver">' + esc(r.ver) + '</td></tr>';
          }).join('');
        })();

        function setLanguage(code) {
          if (!langByCode[code] || code === state.primary) { $('textLangSel').value = state.primary; return; }
          stopListen();
          state.primary = code;
          savePrefs();
          if (tts) tts.lk = code;
          pruneLangData();
          applyI18n();
          renderList($('surah-search').value);
          if (state.view === 'fav') renderFavorites();
          if (readerOpen) renderReader();
          renderRoadmap();
          if (quiz && !$('quizRun').classList.contains('hidden')) showQuestion();
          else if (quiz && quiz.finished && !$('quizDone').classList.contains('hidden')) renderDone();
          loadLang(code).then(function () {
            renderList($('surah-search').value);
            if (readerOpen && state.currentSurah >= 0) renderReader();
          }).catch(function () {});
        }

        /* ---------- Danh sách surah + bộ lọc ----------
           Nút surah đúng như nút sách của Kinh Thánh: một dòng tên duy nhất.
           Hàng lọc trong tab Tra cứu chỉ còn: [Mặc khải ở Mecca · 86] [Mặc khải ở Medina · 28]. */
        /* ---------- Tab Yêu thích (thay tab Giới thiệu cũ): lưới riêng chỉ gồm các surah đã lưu tim ---------- */
        function renderFavorites() {
          var html = '', count = 0;
          SURAHS_META.forEach(function (mm, idx) {
            if (!state.favorites[mm[0]]) return;
            count++;
            html += '<button type="button" class="book" data-idx="' + idx + '">' + surahButtonHTML(idx) + '</button>';
          });
          $('fav-grid').innerHTML = html;
          var emptyEl = $('fav-empty');
          emptyEl.textContent = ui().favEmpty;
          emptyEl.classList.toggle('hidden', count > 0);
          /* Trang đọc nằm trong tab Tra cứu: bấm một surah ở đây thì
             chuyển sang tab Tra cứu rồi mở trang đọc như thường. */
          $('fav-grid').querySelectorAll('.book').forEach(function (el) {
            el.addEventListener('click', function () {
              var idx = parseInt(el.getAttribute('data-idx'), 10);
              setView('read');
              openSurah(idx);
            });
          });
          var fs = $('fav-scroll');
          if (fs) fs.scrollTop = 0;
        }
        function surahButtonHTML(idx) {
          var m = meta(idx);
          if (state.primary === 'ar') {
            return '<b class="ar-name" dir="rtl" lang="ar">' + m.n + '. ' + esc(m.ar) + '</b>';
          }
          return '<b>' + m.n + '. ' + esc(m.en) + '</b>';
        }
        function bindSurahButtons(container) {
          container.querySelectorAll('.book').forEach(function (el) {
            el.addEventListener('click', function () {
              openSurah(parseInt(el.getAttribute('data-idx'), 10));
            });
          });
        }
        var searchTimer = null;
        function renderList(filter) {
          var q = (filter || '').trim().toLowerCase();
          var data = langData[state.primary];
          var t = ui();
          var pool = [];
          SURAHS_META.forEach(function (mm, idx) {
            if (state.curTest === 'meccan' && mm[3] !== 'Meccan') return;
            if (state.curTest === 'medinan' && mm[3] !== 'Medinan') return;
            pool.push(idx);
          });
          var html = '';
          var count = 0;
          pool.forEach(function (idx) {
            var m = meta(idx);
            if (q) {
              var hay = (m.n + ' ' + m.en + ' ' + m.ar).toLowerCase();
              if (hay.indexOf(q) === -1) {
                /* Không khớp tên/số: thử tìm từ khóa trong nội dung câu. */
                if (!data || q.length < 3) return;
                var hits = 0;
                var verses = data[idx] || [];
                for (var i = 0; i < verses.length; i++) {
                  if (verses[i].toLowerCase().indexOf(q) !== -1) hits++;
                }
                if (!hits) return;
              }
            }
            count++;
            html += '<button type="button" class="book" data-idx="' + idx + '">' + surahButtonHTML(idx) + '</button>';
          });
          $('surah-grid').innerHTML = html;
          var emptyEl = $('list-empty');
          if (count === 0) {
            emptyEl.textContent = t.listEmpty;
            emptyEl.classList.remove('hidden');
          } else {
            emptyEl.classList.add('hidden');
          }
          bindSurahButtons($('surah-grid'));
        }
        document.querySelectorAll('[data-test]').forEach(function (b) {
          b.addEventListener('click', function () {
            state.curTest = b.getAttribute('data-test');
            document.querySelectorAll('[data-test]').forEach(function (x) {
              x.setAttribute('aria-pressed', String(x === b));
            });
            renderList($('surah-search').value);
            var ls = $('list-scroll');
            if (ls) ls.scrollTop = 0;
          });
        });
        $('surah-search').addEventListener('input', function () {
          var v = this.value;
          if (searchTimer) clearTimeout(searchTimer);
          searchTimer = setTimeout(function () { renderList(v); }, 160);
        });
        $('searchForm').addEventListener('submit', function (e) {
          e.preventDefault();
          renderList($('surah-search').value);
        });

        /* ---------- Trang đọc ----------
           Trang đọc là trang riêng như Kinh Thánh: mở surah thì ẩn hẳn
           thanh tiêu đề app + thanh tab (body.reading), chỉ còn thanh đọc riêng. */
        function syncReaderChrome() {
          document.body.classList.toggle('reading', readerOpen && !settingsOpen);
        }
        function openSurah(idx, seekAyah) {
          state.currentSurah = idx;
          readerOpen = true;
          $('browser-box').classList.add('hidden');
          $('reader-box').classList.remove('hidden');
          syncReaderChrome();
          renderReader(seekAyah || 0);
          var rc = $('reader-content');
          if (rc && !seekAyah) rc.scrollTop = 0;
        }
        function closeSurah() {
          stopListen();
          state.currentSurah = -1;
          readerOpen = false;
          $('reader-box').classList.add('hidden');
          $('browser-box').classList.remove('hidden');
          syncReaderChrome();
        }
        $('btn-back').addEventListener('click', closeSurah);
        $('btn-prev-surah').addEventListener('click', function () {
          if (state.currentSurah > 0) openSurah(state.currentSurah - 1);
        });
        $('btn-next-surah').addEventListener('click', function () {
          if (state.currentSurah >= 0 && state.currentSurah < SURAHS_META.length - 1) openSurah(state.currentSurah + 1);
        });

        function verseText(code, sIdx, aIdx) {
          var d = langData[code];
          if (!d || !d[sIdx]) return null;
          return d[sIdx][aIdx];
        }
        /* Split a verse into one span per word, each carrying its start/end
           character offsets in the raw text — the same offsets the speech
           engines report for the word being read (karaoke highlighting).
           Y hệt verseWordsHTML của Kinh Thánh. */
        function verseWordsHTML(text) {
          var out = '', last = 0, m;
          var re = /\S+/g;
          while ((m = re.exec(text))) {
            out += esc(text.slice(last, m.index));
            out += '<span class="w" data-s="' + m.index + '" data-e="' + (m.index + m[0].length) + '">' + esc(m[0]) + '</span>';
            last = m.index + m[0].length;
          }
          return out + esc(text.slice(last));
        }
        function verseBlock(sIdx, ayahIdx) {
          var m = meta(sIdx);
          var code = state.primary;
          var L = langByCode[code];
          var txt = verseText(code, sIdx, ayahIdx);
          var html = '<div class="verse" data-v="' + (ayahIdx + 1) + '" id="verse-' + ayahIdx + '"><span class="n">' + (ayahIdx + 1) + '</span>';
          if (txt != null) {
            html += '<span class="vt lang-' + code + '" dir="' + L.dir + '" lang="' + code + '">'
              + verseWordsHTML(txt) + '</span>';
          }
          var key = m.n + ':' + (ayahIdx + 1);
          if (code === 'vi' && FOOTNOTES && FOOTNOTES[key]) {
            html += '<div class="footnote"><b>' + esc(ui().footnoteLabel) + '</b> ' + esc(FOOTNOTES[key]) + '</div>';
          }
          html += '</div>';
          return html;
        }

        function renderReader(seekAyah) {
          /* Playback belongs to one surah + language: if this render is
             for anything else (surah nav, language switch), stop reading. */
          if (tts && (tts.surah !== state.currentSurah || tts.lk !== state.primary)) stopListen();
          if (state.currentSurah < 0) return;
          var sIdx = state.currentSurah;
          var m = meta(sIdx);
          var needFootnotes = state.primary === 'vi';
          if (needFootnotes && !FOOTNOTES) {
            loadFootnotes().then(function () { if (state.currentSurah === sIdx && readerOpen) renderReader(); });
          }
          var ready = !!langData[state.primary];
          paintReaderBar();
          var html = '';
          if (!ready) {
            html += '<p class="loading">' + esc(ui().loading) + '</p>';
            $('reader-content').innerHTML = html;
            loadLang(state.primary).then(function () {
              if (state.currentSurah === sIdx && readerOpen) renderReader(seekAyah);
            }).catch(function () {
              if (state.currentSurah === sIdx && readerOpen) {
                $('reader-content').innerHTML = html + '<div class="listen-warn"><b>' + esc(ui().loadError) + '</b></div>';
              }
            });
            return;
          }
          if (m.n === 9) {
            html += '<p class="note-line">' + esc(ui().basmalahNote) + '</p>';
          } else if (m.n !== 1 && state.primary === 'ar') {
            html += '<p class="basmalah" dir="rtl" lang="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>';
          }
          for (var i = 0; i < m.count; i++) html += verseBlock(sIdx, i);
          $('reader-content').innerHTML = html;
          paintListenBar();
          paintSleepRow();
          refreshVoiceWarn();
          if (seekAyah && seekAyah >= 1) {
            var target = $('verse-' + (seekAyah - 1));
            if (target) {
              target.classList.add('seek');
              target.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
          }
          /* A re-render of the same surah keeps following the verse being read. */
          if (tts && tts.surah === state.currentSurah && tts.lk === state.primary) markSpeaking(tts.idx, false);
        }
        /* Thanh đọc kiểu Kinh Thánh: tên surah căn giữa + tim yêu thích ngay trên thanh. */
        function paintReaderBar() {
          if (state.currentSurah < 0) return;
          var m = meta(state.currentSurah);
          var titleEl = $('reader-title');
          if (state.primary === 'ar') {
            titleEl.innerHTML = '<span class="ar-name" dir="rtl" lang="ar">' + m.n + '. ' + esc(m.ar) + '</span>';
          } else {
            titleEl.textContent = m.n + '. ' + m.en;
          }
          var t = ui();
          var prev = $('btn-prev-surah'), next = $('btn-next-surah');
          prev.textContent = t.prevSurah;
          next.textContent = t.nextSurah;
          prev.disabled = state.currentSurah <= 0;
          next.disabled = state.currentSurah >= SURAHS_META.length - 1;
          paintHeart();
        }
        /* Bấm tim chỉ đổi trạng thái tim, không dựng lại trang đọc (tránh mất vị trí cuộn). */
        function paintHeart() {
          var h = $('btn-heart');
          if (!h || state.currentSurah < 0) return;
          var m = meta(state.currentSurah);
          var fav = !!state.favorites[m.n];
          h.textContent = fav ? '♥' : '♡';
          h.classList.toggle('on', fav);
          h.setAttribute('aria-pressed', String(fav));
          h.setAttribute('aria-label', fav ? ui().favDel : ui().favAdd);
          h.title = fav ? ui().favDel : ui().favAdd;
        }
        $('btn-heart').addEventListener('click', function () {
          if (state.currentSurah < 0) return;
          var n = meta(state.currentSurah).n;
          if (state.favorites[n]) delete state.favorites[n];
          else state.favorites[n] = true;
          savePrefs();
          paintHeart();
        });

        /* ================= NGHE (đọc thành tiếng) =================
           Y hệt engine của Kinh Thánh. Đọc NGUYÊN CÂU một lần (không chia
           đoạn nhỏ): hai engine theo thứ tự ưu tiên —
           1. Native: plugin Capacitor TextToSpeech
              (window.Capacitor.Plugins.TextToSpeech, speak({text, lang,
              rate}) trả Promise settle khi đọc xong câu) hoặc
              window.NativeTTS.
           2. Web Speech (speechSynthesis) làm fallback.
           Karaoke từng từ: plugin native báo vị trí từ qua sự kiện
           onRangeStart, Web Speech qua sự kiện boundary; từ trên trang đã
           bọc sẵn span .w kèm data-s/data-e ngay khi vẽ câu. Engine nào
           không báo vị trí từ thì chỉ cuộn theo câu đang đọc.
           Một nút duy nhất: Nghe ⇄ ■ Dừng. */
        var TTS_LANG = { ar: 'ar-SA', en: 'en-US', vi: 'vi-VN', id: 'id-ID', ur: 'ur-PK', bn: 'bn-BD', tr: 'tr-TR', fa: 'fa-IR', ms: 'ms-MY', fr: 'fr-FR' };
        var synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
        var capTTS = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech) || null;
        var plainTTS = (!capTTS && window.NativeTTS && typeof window.NativeTTS.speak === 'function') ? window.NativeTTS : null;
        var nativeTTS = capTTS || plainTTS;
        var hasSpeech = !!(nativeTTS || synth);
        var tts = null;      // {surah, lk, idx, rate, token, utter}
        var ttsRate = 1;
        var ttsSeq = 0;
        if (synth) { try { synth.getVoices(); } catch (e) {} }   // warm up the voice list
        function ttsTag(code) { return TTS_LANG[code] || 'en-US'; }
        function speakNative(text, langTag, rate) {
          if (capTTS) return capTTS.speak({ text: text, lang: langTag, rate: rate });
          return plainTTS.speak(text, langTag, rate);
        }
        function haltSpeech() {
          if (capTTS) { try { var p = capTTS.stop(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
          else if (plainTTS && typeof plainTTS.stop === 'function') { try { plainTTS.stop(); } catch (e) {} }
          if (synth) { try { synth.cancel(); } catch (e) {} }
        }
        function normLang(l) { return String(l || '').toLowerCase().replace(/_/g, '-'); }
        function pickVoice(code) {
          if (!synth) return null;
          var want = normLang(ttsTag(code));
          var short = want.split('-')[0];
          var voices = synth.getVoices() || [];
          var v = null;
          voices.forEach(function (x) { if (!v && normLang(x.lang) === want) v = x; });
          if (!v) voices.forEach(function (x) { if (!v && normLang(x.lang).indexOf(short) === 0) v = x; });
          return v;
        }
        if (synth && synth.onvoiceschanged !== undefined) {
          synth.onvoiceschanged = function () { refreshVoiceWarn(); };
        }
        function refreshVoiceWarn() {
          var warn = $('listen-warn');
          if (!warn) return;
          if (nativeTTS) { warn.classList.add('hidden'); return; }
          if (!synth || !readerOpen || state.currentSurah < 0 || (synth.getVoices() || []).length === 0 || pickVoice(state.primary)) {
            warn.classList.add('hidden');
            return;
          }
          var name = langByCode[state.primary].name;
          if (uiLang() === 'en') {
            warn.innerHTML = '<b>This device has no ' + esc(name) + ' voice.</b> '
              + 'It is reading with the default voice (usually English), so ' + esc(name) + ' text will sound like English. '
              + 'To listen properly, install a ' + esc(name) + ' voice: on Android go to Settings → System → Languages & input → Text-to-speech → download the ' + esc(name) + ' voice; '
              + 'on iPhone go to Settings → Accessibility → Spoken Content → Voices → choose and download the ' + esc(name) + ' voice. Then come back and press Listen again.';
          } else {
            warn.innerHTML = '<b>Thiết bị chưa có giọng ' + esc(name) + '.</b> '
              + 'Máy đang đọc bằng giọng mặc định (thường là tiếng Anh) nên chữ ' + esc(name) + ' sẽ nghe như tiếng Anh. '
              + 'Để nghe đúng tiếng, hãy cài giọng ' + esc(name) + ' cho máy: trên Android vào Cài đặt → Hệ thống → Ngôn ngữ và nhập liệu → Chuyển văn bản thành lời nói → tải giọng ' + esc(name) + '; '
              + 'trên iPhone vào Cài đặt → Trợ năng → Nội dung được nói → Giọng nói → chọn và tải giọng ' + esc(name) + '. Cài xong quay lại bấm Nghe lại.';
          }
          warn.classList.remove('hidden');
        }

        /* ---------- karaoke word highlighting (y hệt Kinh Thánh) ---------- */
        function clearKara() {
          var box = $('reader-content');
          if (!box) return;
          box.querySelectorAll('.w.kara').forEach(function (el) { el.classList.remove('kara'); });
        }
        function highlightWord(start, end) {
          if (!tts) return;
          var verseEl = $('verse-' + tts.idx);
          if (!verseEl) return;
          var words = verseEl.querySelectorAll('.vt .w');
          var hit = null;
          for (var i = 0; i < words.length; i++) {
            var s = +words[i].getAttribute('data-s'), e = +words[i].getAttribute('data-e');
            if (start >= s && start < e) { hit = words[i]; break; }
            if (end != null && end > s && start < e) { hit = words[i]; break; }
          }
          if (!hit) {
            for (var j = 0; j < words.length; j++) { if (+words[j].getAttribute('data-s') >= start) { hit = words[j]; break; } }
          }
          if (!hit) return;
          words.forEach(function (w) { w.classList.toggle('kara', w === hit); });
        }
        if (capTTS && typeof capTTS.addListener === 'function') {
          try {
            capTTS.addListener('onRangeStart', function (info) {
              if (!tts || !info) return;
              var s = (info.start != null) ? +info.start : (info.charIndex != null ? +info.charIndex : null);
              if (s == null || isNaN(s)) return;
              var e = null;
              if (info.end != null) e = +info.end;
              else if (info.charLength != null) e = s + (+info.charLength);
              else if (info.spokenWord) e = s + String(info.spokenWord).length;
              highlightWord(s, e);
            });
          } catch (e) {}
        }
        function markSpeaking(idx, scroll) {
          clearKara();
          var el = $('verse-' + idx);
          if (el && scroll !== false) {
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
          }
        }
        function speakVerse() {
          if (!tts) return;
          var m = meta(tts.surah);
          var arr = langData[tts.lk];
          if (!arr || !arr[tts.surah] || tts.idx >= m.count) { stopListen(); return; }   // end of surah: stop
          markSpeaking(tts.idx);
          var token = tts.token, idx = tts.idx, utter = ++tts.utter;
          /* A stale utterance (stopped, speed changed) must never
             advance the queue when it settles late. */
          var advance = function () {
            if (tts && tts.token === token && tts.utter === utter) { tts.idx = idx + 1; speakVerse(); }
          };
          var text = arr[tts.surah][idx];
          if (nativeTTS) {
            var p;
            try { p = speakNative(text, ttsTag(tts.lk), tts.rate); }
            catch (e) { stopListen(); return; }
            Promise.resolve(p).then(advance, advance);
            return;
          }
          if (!synth) { stopListen(); return; }
          var u = new SpeechSynthesisUtterance(text);
          u.lang = ttsTag(tts.lk);
          var v = pickVoice(tts.lk); if (v) u.voice = v;
          u.rate = tts.rate;
          u.onboundary = function (ev) {
            if (!tts || tts.token !== token || tts.utter !== utter) return;
            if (!ev || ev.charIndex == null) return;
            highlightWord(+ev.charIndex, ev.charLength != null ? +ev.charIndex + (+ev.charLength) : null);
          };
          u.onend = advance;
          u.onerror = function (e) {
            if (e && (e.error === 'canceled' || e.error === 'interrupted')) return;
            advance();
          };
          try { synth.speak(u); } catch (e) { stopListen(); }
        }
        function startListen() {
          if (!hasSpeech) { showToast(ui().noVoice); return; }
          if (state.currentSurah < 0 || !langData[state.primary]) return;
          if (tts) { tts.token = ++ttsSeq; tts = null; }
          haltSpeech();
          tts = { surah: state.currentSurah, lk: state.primary, idx: 0, rate: ttsRate, token: ++ttsSeq, utter: 0 };
          var token = tts.token;
          paintListenBar();
          /* A short beat after cancel(): speaking in the same tick can be
             swallowed by some engines. */
          setTimeout(function () { if (tts && tts.token === token) speakVerse(); }, 80);
        }
        function stopListen() {
          if (tts) tts.token = ++ttsSeq;
          tts = null;
          haltSpeech();
          clearKara();
          paintListenBar();
        }
        /* One button does both jobs: idle it reads "▶ Listen"; while the
           surah is being read it flips to "■ Stop". */
        function paintListenBar() {
          var btn = $('btn-listen');
          if (!btn) return;
          var d = ui();
          btn.disabled = !hasSpeech;
          btn.textContent = !tts ? '▶ ' + d.listen : '■ ' + d.stopListen;
          var sel = $('listen-rate');
          if (sel) sel.value = String(tts ? tts.rate : ttsRate);
        }
        $('btn-listen').addEventListener('click', function () {
          if (tts) stopListen();
          else startListen();
        });
        $('listen-rate').addEventListener('change', function () {
          ttsRate = parseFloat(this.value) || 1;
          if (tts) {
            tts.rate = ttsRate;
            tts.token = ++ttsSeq;   // restart the current verse at the new speed
            haltSpeech();
            var token = tts.token;
            setTimeout(function () { if (tts && tts.token === token) speakVerse(); }, 80);
          }
        });

        /* ================= SLEEP TIMER (hẹn giờ tắt) =================
           Counts down from the chosen minutes; at zero it stops playback.
           The timer lives outside the reader DOM so surah changes and
           re-renders keep it running; the row is repainted after each render. */
        var sleepT = null;   // {mins, end, iv}
        function fmtCountdown(ms) {
          var s = Math.max(0, Math.ceil(ms / 1000));
          var m2 = Math.floor(s / 60), r = s % 60;
          return (m2 >= 60 ? Math.floor(m2 / 60) + ':' + String(m2 % 60).padStart(2, '0') : String(m2)) + ':' + String(r).padStart(2, '0');
        }
        function setSleepTimer(mins) {
          if (sleepT) { clearInterval(sleepT.iv); sleepT = null; }
          if (mins > 0) {
            sleepT = { mins: mins, end: Date.now() + mins * 60000, iv: setInterval(tickSleepTimer, 500) };
            showToast(ui().sleepSet + mins + ui().sleepMin);
          }
          paintSleepRow();
        }
        function tickSleepTimer() {
          if (!sleepT) return;
          if (Date.now() >= sleepT.end) {
            clearInterval(sleepT.iv); sleepT = null;
            stopListen();
            showToast(ui().sleepDone);
          }
          paintSleepRow();
        }
        function paintSleepRow() {
          var sel = $('listen-time'); if (!sel) return;
          var face = sel.querySelector('[data-count-opt]'); if (!face) return;
          if (sleepT) {
            face.textContent = '⏱ ' + fmtCountdown(sleepT.end - Date.now());
            sel.classList.add('counting');
          } else {
            face.textContent = 'Time';
            sel.classList.remove('counting');
          }
          sel.value = '__count';   // the closed select always shows the Time / countdown face
        }
        $('listen-time').addEventListener('change', function () {
          var v = this.value;
          if (v === '__count') { paintSleepRow(); return; }   // the countdown face itself: keep the running timer
          setSleepTimer(parseInt(v, 10) || 0);
        });

        /* ================= TRẮC NGHIỆM =================
           Cùng engine với Kinh Thánh: các mục (SETS) dạng thẻ + nút Vào thi,
           Thi tổng hợp, Ôn câu sai; mỗi lượt examLen câu (10/20/30, mặc định
           30, chỉnh trong Cài đặt); 30 giây mỗi câu; có Câu trước / Câu tiếp;
           chấm ngay kèm giải thích + nút Xem câu gốc; màn kết quả có điểm
           cao nhất từng mục và danh sách xem lại các câu sai.
           Ngân hàng câu hỏi sinh từ dữ liệu thật của Kinh Koran (số câu mỗi
           surah, nơi mặc khải, thứ tự, ý nghĩa tên surah, nhận diện câu kinh)
           cộng bộ câu cố định song ngữ — không bịa số liệu. */
        var FIXED = [
          { q_vi: 'Kinh Koran gồm bao nhiêu surah (chương)?', q_en: 'How many surahs (chapters) does the Quran contain?',
            o_vi: ['114 surah', '99 surah', '120 surah', '77 surah'], o_en: ['114 surahs', '99 surahs', '120 surahs', '77 surahs'], a: 0,
            e_vi: 'Kinh Koran có 114 surah, mở đầu bằng Al-Faatiha và kết thúc bằng An-Naas.',
            e_en: 'The Quran has 114 surahs, opening with Al-Faatiha and ending with An-Naas.', ref: null },
          { q_vi: 'Theo cách đếm phổ biến, toàn bộ Kinh Koran có bao nhiêu câu (ayah)?', q_en: 'By the common count, how many verses (ayahs) does the whole Quran have?',
            o_vi: ['6.236 câu', '6.666 câu', '5.238 câu', '7.102 câu'], o_en: ['6,236 verses', '6,666 verses', '5,238 verses', '7,102 verses'], a: 0,
            e_vi: 'Tổng số ayah là 6.236 theo cách đếm được dùng trong dữ liệu của trang này.',
            e_en: 'The total is 6,236 ayahs by the counting used in this app’s data.', ref: null },
          { q_vi: 'Kinh Koran được mặc khải bằng ngôn ngữ nào?', q_en: 'In which language was the Quran revealed?',
            o_vi: ['Tiếng Ả Rập', 'Tiếng Hebrew', 'Tiếng Ba Tư', 'Tiếng Aram'], o_en: ['Arabic', 'Hebrew', 'Persian', 'Aramaic'], a: 0,
            e_vi: 'Nguyên bản Kinh Koran là tiếng Ả Rập; các ngôn ngữ khác trên trang này đều là bản dịch.',
            e_en: 'The original Quran is in Arabic; every other language on this page is a translation.', ref: null },
          { q_vi: 'Surah dài nhất trong Kinh Koran là surah nào?', q_en: 'Which is the longest surah of the Quran?',
            o_vi: ['Al-Baqara (286 câu)', 'Aal-i-Imraan (200 câu)', 'An-Nisaa (176 câu)', 'Al-A’raaf (206 câu)'],

        var SETS = [
          { id: 'fatiha', viT: 'Al-Faatiha & các surah đầu', enT: 'Al-Faatiha & the opening surahs' },
          { id: 'meccan', viT: 'Surah mặc khải ở Mecca', enT: 'Meccan surahs' },
          { id: 'medinan', viT: 'Surah mặc khải ở Medina', enT: 'Medinan surahs' },
          { id: 'struct', viT: '114 surah & cấu trúc Kinh Koran', enT: 'The 114 surahs & the Quran’s structure' }
        ];
        var best = {};        // setId -> điểm cao nhất trong phiên
        var wrongPool = [];   // câu hỏi trả lời sai trong phiên này
        function setTitle(id) {
          var s = null;
          SETS.forEach(function (x) { if (x.id === id) s = x; });
          if (s) return uiLang() === 'en' ? s.enT : s.viT;
          var d = ui();
          if (id === 'mixed') return d.mixedT;
          if (id === 'wrong') return d.wrongT;
          return '';
        }
        function renderRoadmap() {
          var d = ui();
          $('roadmap').innerHTML = SETS.map(function (s) {
            var title = uiLang() === 'en' ? s.enT : s.viT;
            return '<div class="stage"><div class="stagecard">'
              + '<h3>' + esc(title) + '</h3>'
              + (best[s.id] !== undefined ? '<span class="pill best">' + esc(d.best) + ': ' + best[s.id] + '/' + examLen + '</span>' : '')
              + '<button type="button" class="startbtn" data-start="' + s.id + '">' + esc(d.start) + '</button>'
              + '</div></div>';
          }).join('');
          $('mixed-title').textContent = d.mixedT;
          $('mixed-q-word').textContent = d.questions;
          $('mixed-start').textContent = d.start;
          $('mixedCount').textContent = examLen;
          var bm = $('best-mixed');
          if (best.mixed !== undefined) { bm.classList.remove('hidden'); bm.textContent = d.best + ': ' + best.mixed + '/' + examLen; }
          else bm.classList.add('hidden');
          $('wrong-title').textContent = d.wrongT;
          $('wrong-start').textContent = d.review;
          $('wrongStage').classList.toggle('hidden', !wrongPool.length);
          $('wrongCount').textContent = wrongPool.length + ' ' + d.questions;
          document.querySelectorAll('#quizHome [data-start]').forEach(function (b) {
            b.addEventListener('click', function () { startQuiz(b.getAttribute('data-start')); });
          });
        }

        var quiz = null, timerId = null;
        var seenBySet = {};   // câu đã ra theo từng mục trong phiên, tránh lặp cho tới khi dùng hết ngân hàng
        function sampleQuestions(pool, setId, n) {
          if (!pool || !pool.length) return [];
          if (n >= pool.length) { seenBySet[setId] = {}; return shuffle(pool); }
          var seen = seenBySet[setId];
          if (!seen) { seen = {}; seenBySet[setId] = seen; }
          var fresh = pool.filter(function (q) { return !seen[q.q_vi + '|' + q.o_vi[q.a]]; });
          if (fresh.length < n) { seenBySet[setId] = {}; seen = seenBySet[setId]; fresh = pool.slice(); }
          var picked = shuffle(fresh).slice(0, n);
          picked.forEach(function (q) { seen[q.q_vi + '|' + q.o_vi[q.a]] = true; });
          return picked;
        }
        function startQuiz(setId) {
          /* Câu nhận diện câu kinh cần văn bản ngôn ngữ đang chọn — tải trước nếu chưa có. */
          loadLang(state.primary).catch(function () {}).then(function () {
            BANKS = buildBanks();
            var banks = BANKS;
            var qs;
            if (setId === 'mixed') qs = sampleQuestions([].concat(banks.fatiha, banks.meccan, banks.medinan, banks.struct), 'mixed', examLen);
            else if (setId === 'wrong') qs = shuffle(wrongPool);
            else qs = sampleQuestions(banks[setId], setId, examLen);
            if (!qs.length) return;
            quiz = {
              setId: setId,
              qs: qs.map(function (q) {
                var order = shuffle([0, 1, 2, 3]);
                return { q: q, order: order, correctPos: order.indexOf(q.a), answered: false, chosenPos: -1, timedOut: false, timeLeft: 0 };
              }),
              idx: 0, score: 0, results: [], answered: false, chosenPos: -1, timedOut: false, timeLeft: 30, finished: false, _shownIdx: -1
            };
            document.body.classList.add('quizzing');
            $('quizHome').classList.add('hidden');
            $('quizDone').classList.add('hidden');
            $('quizRun').classList.remove('hidden');
            showQuestion();
          });
        }
        function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
        /* Bottom bar of the run screen: Prev on the left half, Next on the
           right half. Prev steps back through questions already answered;
           Next only unlocks once the current question is answered. */
        function updateNav() {
          var d = ui(), prev = $('prevQBtn'), next = $('nextQBtn');
          if (!prev || !next) return;
          prev.textContent = d.prevQ;
          if (!quiz) { prev.disabled = true; next.disabled = true; return; }
          prev.disabled = quiz.idx <= 0;
          next.textContent = quiz.idx >= quiz.qs.length - 1 ? d.finish : d.nextQ;
          next.disabled = !quiz.answered;
        }
        function showQuestion() {
          stopTimer();
          var d = ui(), item = quiz.qs[quiz.idx], q = item.q;
          /* Each question keeps its own state on its item, so stepping back
             with Prev shows it exactly as it was left. */
          quiz.answered = !!item.answered;
          quiz.chosenPos = (item.chosenPos === undefined ? -1 : item.chosenPos);
          quiz.timedOut = !!item.timedOut;
          $('progFill').style.width = (quiz.idx / quiz.qs.length * 100) + '%';
          var en = uiLang() === 'en';
          var qMain = en ? q.q_en : q.q_vi;
          var opts = en ? q.o_en : q.o_vi;
          var html = '<div class="qk">' + esc(d.question) + ' ' + (quiz.idx + 1) + '/' + quiz.qs.length + ' · ' + esc(setTitle(quiz.setId)) + '</div>'
            + '<h3>' + esc(qMain) + '</h3>'
            + (q.verse ? '<p class="qverse" dir="' + langByCode[state.primary].dir + '">' + esc(q.verse) + '</p>' : '')
            + '<div class="opts">' + item.order.map(function (oi, pos) {
              return '<button type="button" class="opt" data-pos="' + pos + '">'
                + '<span class="letter">' + 'ABCD'[pos] + '</span>'
                + '<span>' + esc(opts[oi]) + '</span></button>';
            }).join('') + '</div>';
          $('qcard').innerHTML = html;
          $('qcard').querySelectorAll('.opt').forEach(function (b) {
            b.addEventListener('click', function () { answer(parseInt(b.getAttribute('data-pos'), 10), false); });
          });
          var exT = $('explainTop'); exT.classList.remove('show'); exT.innerHTML = '';
          if (quiz.answered) {
            paintAnsweredOptions();
            var tEl = $('timer'), tl = item.timeLeft || 0;
            tEl.textContent = '0:' + String(Math.max(0, tl)).padStart(2, '0');
            tEl.classList.toggle('low', tl <= 10);
            fillExplain();
            updateNav();
            return;
          }
          updateNav();
          // timer 30s — re-rendering the same unanswered question (language
          // switch, stepping back and forth) keeps the time it had left
          var left = (quiz._shownIdx === quiz.idx && quiz.timeLeft > 0) ? quiz.timeLeft : 30;
          quiz._shownIdx = quiz.idx;
          var timerEl = $('timer');
          var paint = function () {
            quiz.timeLeft = left;
            timerEl.textContent = '0:' + String(left).padStart(2, '0');
            timerEl.classList.toggle('low', left <= 10);
          };
          paint();
          timerId = setInterval(function () {
            left--; paint();
            if (left <= 0) { stopTimer(); answer(-1, true); }
          }, 1000);
        }
        function paintAnsweredOptions() {
          var item = quiz.qs[quiz.idx];
          $('qcard').querySelectorAll('.opt').forEach(function (b) {
            var p = parseInt(b.getAttribute('data-pos'), 10);
            b.disabled = true;
            if (p === item.correctPos) b.classList.add('right');
            else if (p === quiz.chosenPos) b.classList.add('wrong');
          });
        }
        function answer(pos, timedOut) {
          if (!quiz || quiz.answered) return;
          stopTimer();
          quiz.answered = true; quiz.chosenPos = pos; quiz.timedOut = !!timedOut;
          var item = quiz.qs[quiz.idx], q = item.q;
          item.answered = true; item.chosenPos = pos; item.timedOut = !!timedOut; item.timeLeft = quiz.timeLeft;
          var ok = pos === item.correctPos;
          if (ok) quiz.score++;
          quiz.results.push({ q: q, chosenPos: pos, item: item });
          if (!ok && wrongPool.indexOf(q) === -1) wrongPool.push(q);
          if (ok && quiz.setId === 'wrong') {
            var wi = wrongPool.indexOf(q);
            if (wi >= 0) wrongPool.splice(wi, 1);
          }
          paintAnsweredOptions();
          fillExplain();
          updateNav();
          var nb = $('nextQBtn'); if (nb) nb.focus();
        }
        function fillExplain() {
          var d = ui(), item = quiz.qs[quiz.idx], q = item.q;
          var pos = quiz.chosenPos, timedOut = quiz.timedOut;
          var ok = pos === item.correctPos;
          var en = uiLang() === 'en';
          var opts = en ? q.o_en : q.o_vi;
          var chosenTxt = pos < 0 ? d.notAnswered : opts[item.order[pos]];
          var rightTxt = opts[q.a];
          var ex = $('explainTop'); if (!ex) return;
          ex.classList.add('show');
          var html = '<p class="verdict ' + (ok ? 'ok' : 'no') + '">' + (timedOut ? esc(d.timeUp) + ' ' : '') + esc(ok ? d.correct : d.wrong) + '</p>'
            + (ok ? '' : '<p>' + esc(d.yourAnswer) + '<b>' + esc(chosenTxt) + '</b><br>' + esc(d.rightAnswer) + '<b>' + esc(rightTxt) + '</b></p>')
            + '<p>' + esc(en ? q.e_en : q.e_vi) + '</p>';
          if (q.ref) {
            html += '<div class="refrow"><span class="refchip">' + esc(refLabel(q.ref[0], q.ref[1])) + '</span>'
              + '<button type="button" class="ghostbtn" id="viewVerseBtn">' + esc(d.viewVerse) + '</button></div>';
          }
          ex.innerHTML = html;
          var vb = $('viewVerseBtn');
          if (vb) vb.addEventListener('click', function () { viewVerse(q.ref[0], q.ref[1]); });
        }
        /* Xem câu gốc: rời bài thi, mở đúng surah ở tab Tra cứu và cuộn tới câu. */
        function viewVerse(sIdx, ayah) {
          stopTimer();
          quiz = null;
          document.body.classList.remove('quizzing');
          $('quizRun').classList.add('hidden');
          $('quizDone').classList.add('hidden');
          $('quizHome').classList.remove('hidden');
          renderRoadmap();
          setView('read');
          renderList($('surah-search').value);
          openSurah(sIdx, ayah);
        }
        $('prevQBtn').addEventListener('click', function () {
          if (!quiz || quiz.idx <= 0) return;
          quiz.idx--; showQuestion();
        });
        $('nextQBtn').addEventListener('click', function () {
          if (!quiz || !quiz.answered) return;
          if (quiz.idx >= quiz.qs.length - 1) finishQuiz();
          else { quiz.idx++; showQuestion(); }
        });
        function finishQuiz() {
          stopTimer();
          document.body.classList.remove('quizzing');
          if (best[quiz.setId] === undefined || quiz.score > best[quiz.setId]) best[quiz.setId] = quiz.score;
          quiz.finished = true;
          $('quizRun').classList.add('hidden');
          renderDone();
          renderRoadmap();
        }
        function renderDone() {
          var d = ui();
          var wrongs = quiz.results.filter(function (r) { return r.chosenPos !== r.item.correctPos; });
          var done = $('quizDone');
          done.classList.remove('hidden');
          var en = uiLang() === 'en';
          var verdict;
          if (quiz.score === quiz.qs.length) verdict = d.allRight;
          else if (quiz.score >= Math.ceil(quiz.qs.length * 0.8)) verdict = d.verdict8;
          else if (quiz.score >= Math.ceil(quiz.qs.length * 0.5)) verdict = d.verdict5;
          else verdict = d.verdict0;
          var html = '<div class="panel scorecard">'
            + '<h2>' + esc(d.doneTitle) + '</h2>'
            + '<div class="scorebig">' + quiz.score + '/' + quiz.qs.length + '</div>'
            + '<p>' + esc(verdict) + '</p>'
            + '<div class="scoreactions">'
            + '<button type="button" class="nextbtn" id="againBtn">' + esc(d.again) + '</button>'
            + (wrongs.length ? '<button type="button" class="ghostbtn" id="revBtn">' + esc(d.reviewWrong) + ' (' + wrongs.length + ')</button>' : '')
            + '<button type="button" class="ghostbtn" id="backBtn">' + esc(d.backRoad) + '</button>'
            + '<button type="button" class="ghostbtn" id="doneHomeBtn">' + esc(d.tabRead) + '</button>'
            + '</div></div>';
          if (wrongs.length) {
            html += '<div class="review"><h3>' + esc(d.reviewTitle) + '</h3>' + wrongs.map(function (r) {
              var q = r.q;
              var opts = en ? q.o_en : q.o_vi;
              var yours = r.chosenPos < 0 ? d.notAnswered : opts[r.item.order[r.chosenPos]];
              return '<div class="ritem"><b>' + esc(en ? q.q_en : q.q_vi) + '</b>'
                + '<span class="yours">' + esc(d.yourAnswer) + esc(yours) + '</span><br>'
                + '<span class="corr">' + esc(d.rightAnswer) + esc(opts[q.a]) + '</span>'
                + (q.ref ? '<br><span style="color:var(--ink2)">' + esc(refLabel(q.ref[0], q.ref[1])) + '</span>' : '')
                + '</div>';
            }).join('') + '</div>';
          }
          done.innerHTML = html;
          $('againBtn').addEventListener('click', function () { startQuiz(quiz.setId === 'wrong' ? 'mixed' : quiz.setId); });
          var rb = $('revBtn');
          if (rb) rb.addEventListener('click', function () { startQuiz('wrong'); });
          $('backBtn').addEventListener('click', function () {
            done.classList.add('hidden');
            $('quizHome').classList.remove('hidden');
            renderRoadmap();
          });
          /* Về thẳng danh sách surah chính ban đầu từ màn kết quả. */
          $('doneHomeBtn').addEventListener('click', function () {
            quiz = null;
            done.classList.add('hidden');
            $('quizHome').classList.remove('hidden');
            closeSurah();
            setView('read');
          });
        }
        $('quitQuiz').addEventListener('click', function () {
          stopTimer();
          quiz = null;
          document.body.classList.remove('quizzing');
          $('quizRun').classList.add('hidden');
          $('quizHome').classList.remove('hidden');
          renderRoadmap();
        });

        /* ---------- Khởi tạo ---------- */
        applyI18n();
        renderList('');
        renderRoadmap();
        paintListenBar();
        paintSleepRow();
        /* Tải sẵn ngôn ngữ đang chọn (đã khôi phục từ localStorage nếu có) để tìm từ khóa trong nội dung hoạt động. */
        loadLang(state.primary).then(function () { renderList($('surah-search').value); }).catch(function () {});
      })();
    </script>
  </body>
</html>
